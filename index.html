    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABDOU DZ | الفخامة الذهبية</title>
    <link id="faviconLink" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{
          --gold:#d4af37;
          --gold-light:#f4d47c;
          --gold-dark:#a8842a;
          --black:#0a0a0a;
          --black-2:#141414;
          --black-3:#1c1c1c;
          --gray:#8a8a8a;
          --border:#2a2a2a;
          --danger:#e74c3c;
          --success:#27ae60;
          --radius:16px;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;}
        body{
          background:var(--black);color:#f5f5f5;line-height:1.7;min-height:100vh;
          background-image:
            radial-gradient(circle at 20% 10%, rgba(212,175,55,.08) 0%, transparent 40%),
            radial-gradient(circle at 80% 90%, rgba(212,175,55,.06) 0%, transparent 40%);
        }
        a{text-decoration:none;color:inherit;}
        img{max-width:100%;display:block;}

        /* ============ Header ============ */
        header{
          background:rgba(10,10,10,.95);
          backdrop-filter:blur(12px);
          position:sticky;top:0;z-index:100;
          border-bottom:1px solid var(--border);
        }
        .nav{
          max-width:1250px;margin:auto;padding:14px 22px;
          display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
        }
        .logo{
          display:flex;align-items:center;gap:12px;cursor:pointer;
        }
        .logo-img{
          width:48px;height:48px;object-fit:contain;border-radius:50%;
          border:2px solid var(--gold);padding:2px;background:var(--black-2);
          display:none;transition:.3s;
          box-shadow:0 0 20px rgba(212,175,55,.4);
        }
        .logo-img.show{display:block;}
        .logo-img:hover{transform:scale(1.08);box-shadow:0 0 30px rgba(212,175,55,.7);}
        .logo-text{
          font-size:1.6rem;font-weight:900;letter-spacing:2px;
          background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));
          -webkit-background-clip:text;background-clip:text;color:transparent;
        }
        .logo-text span{color:#fff;-webkit-text-fill-color:#fff;}
        .nav-links{display:flex;gap:24px;font-weight:600;color:#b0b0b0;font-size:.95rem;}
        .nav-links a:hover{color:var(--gold);}
        .nav-actions{display:flex;align-items:center;gap:8px;}
        .icon-btn{
          background:var(--black-3);border:1px solid var(--border);color:var(--gold);
          cursor:pointer;padding:8px 14px;border-radius:50px;font-weight:700;font-size:.85rem;
          transition:.25s;
        }
        .icon-btn:hover{background:var(--gold);color:var(--black);border-color:var(--gold);}

        /* ============ Hero ============ */
        .hero{text-align:center;padding:80px 20px 70px;position:relative;overflow:hidden;}
        .hero::before{
          content:'';position:absolute;inset:0;
          background:radial-gradient(ellipse at center, rgba(212,175,55,.15) 0%, transparent 60%);
          pointer-events:none;
        }
        .hero-logo{
          width:130px;height:130px;object-fit:contain;
          margin:0 auto 22px;display:none;
          border-radius:50%;padding:8px;
          background:rgba(212,175,55,.08);
          border:2px solid var(--gold);
          box-shadow:0 0 50px rgba(212,175,55,.5);
          animation:heroGlow 3s ease-in-out infinite alternate;
        }
        .hero-logo.show{display:block;}
        @keyframes heroGlow{
          from{box-shadow:0 0 30px rgba(212,175,55,.3);}
          to{box-shadow:0 0 60px rgba(212,175,55,.7);}
        }
        .hero h1{
          font-size:3rem;font-weight:900;margin-bottom:16px;line-height:1.2;
          background:linear-gradient(135deg,#fff,var(--gold-light),var(--gold));
          -webkit-background-clip:text;background-clip:text;color:transparent;
        }
        .hero p{font-size:1.15rem;color:#a0a0a0;max-width:600px;margin:auto;}
        .hero button{
          margin-top:32px;
          background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));
          color:var(--black);border:none;padding:16px 42px;border-radius:50px;
          font-size:1rem;font-weight:800;cursor:pointer;transition:.3s;
          box-shadow:0 8px 32px rgba(212,175,55,.4);letter-spacing:.5px;
        }
        .hero button:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(212,175,55,.6);}
        .gold-line{height:2px;width:80px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px auto;}

        /* ============ Sections ============ */
        .section{max-width:1250px;margin:auto;padding:60px 22px;}
        .section-title{
          font-size:2rem;font-weight:900;margin-bottom:10px;text-align:center;
          background:linear-gradient(135deg,#fff,var(--gold-light));
          -webkit-background-clip:text;background-clip:text;color:transparent;
        }
        .section-sub{text-align:center;color:var(--gray);margin-bottom:44px;}

        /* ============ Products ============ */
        .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px;}
        .card{
          background:linear-gradient(160deg,var(--black-2),var(--black-3));
          border:1px solid var(--border);border-radius:var(--radius);
          overflow:hidden;transition:.35s;display:flex;flex-direction:column;position:relative;
        }
        .card::before{
          content:'';position:absolute;top:0;left:0;right:0;height:3px;
          background:linear-gradient(90deg,transparent,var(--gold),transparent);
          opacity:0;transition:.35s;
        }
        .card:hover{transform:translateY(-8px);border-color:var(--gold);box-shadow:0 20px 50px rgba(212,175,55,.15);}
        .card:hover::before{opacity:1;}
        .card-img{
          height:230px;background:var(--black);display:grid;place-items:center;
          font-size:4rem;overflow:hidden;position:relative;
        }
        .card-img img{width:100%;height:100%;object-fit:cover;transition:.5s;}
        .card:hover .card-img img{transform:scale(1.08);}
        .card-body{padding:18px;display:flex;flex-direction:column;gap:12px;flex:1;}
        .card-title{font-weight:700;font-size:1.1rem;color:#f5f5f5;}
        .card-price{
          font-weight:900;font-size:1.35rem;
          background:linear-gradient(135deg,var(--gold-light),var(--gold));
          -webkit-background-clip:text;background-clip:text;color:transparent;
        }
        .card-price small{color:var(--gray);font-weight:500;font-size:.8rem;-webkit-text-fill-color:var(--gray);}
        .add-btn{
          margin-top:auto;
          background:linear-gradient(135deg,var(--gold),var(--gold-dark));
          color:var(--black);border:none;padding:13px;border-radius:10px;
          font-weight:800;cursor:pointer;transition:.25s;font-size:.95rem;letter-spacing:.5px;
        }
        .add-btn:hover{background:linear-gradient(135deg,var(--gold-light),var(--gold));box-shadow:0 8px 24px rgba(212,175,55,.4);}
        .loading{text-align:center;padding:60px;color:var(--gray);grid-column:1/-1;font-size:1.1rem;}

        /* ============ Overlay & Panels ============ */
        .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;z-index:200;backdrop-filter:blur(4px);}
        .overlay.open{display:block;}
        .panel{
          position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);
          width:520px;max-width:94%;max-height:92vh;overflow-y:auto;
          background:linear-gradient(160deg,var(--black-2),var(--black));
          border:1px solid var(--gold-dark);border-radius:20px;
          z-index:201;padding:30px;display:none;opacity:0;transition:.3s;
          box-shadow:0 30px 80px rgba(0,0,0,.8), 0 0 60px rgba(212,175,55,.1);
        }
        .panel.open{display:block;opacity:1;transform:translate(-50%,-50%) scale(1);}
        .panel h3{
          margin-bottom:20px;text-align:center;font-size:1.4rem;
          background:linear-gradient(135deg,#fff,var(--gold-light));
          -webkit-background-clip:text;background-clip:text;color:transparent;
        }
        .panel::-webkit-scrollbar{width:8px;}
        .panel::-webkit-scrollbar-track{background:var(--black);}
        .panel::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:4px;}

        /* ============ Form ============ */
        .field{margin-bottom:16px;}
        .field label{display:block;font-size:.85rem;font-weight:700;margin-bottom:7px;color:var(--gold-light);letter-spacing:.3px;}
        .field input,.field select,.field textarea{
          width:100%;padding:13px 15px;background:var(--black);color:#f5f5f5;
          border:1px solid var(--border);border-radius:10px;
          font-size:.95rem;outline:none;font-family:inherit;transition:.25s;
        }
        .field input:focus,.field select:focus,.field textarea:focus{
          border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15);
        }
        .field input::placeholder,.field textarea::placeholder{color:#555;}

        .cod-badge{
          background:linear-gradient(135deg,rgba(212,175,55,.15),rgba(212,175,55,.05));
          border:1px solid var(--gold-dark);color:var(--gold-light);
          padding:12px;border-radius:10px;font-weight:700;text-align:center;
          margin-bottom:16px;font-size:.9rem;
        }

        .order-summary{
          background:rgba(212,175,55,.05);border:1px solid var(--border);
          border-radius:12px;padding:16px;margin-bottom:18px;font-size:.9rem;
        }
        .order-summary .row{display:flex;justify-content:space-between;margin-bottom:8px;color:#c0c0c0;}
        .order-summary .row.total{
          font-weight:900;color:var(--gold);font-size:1.05rem;
          border-top:1px dashed var(--border);padding-top:10px;margin-top:10px;
        }

        .submit-btn{
          width:100%;
          background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));
          color:var(--black);border:none;padding:15px;border-radius:12px;
          font-weight:900;cursor:pointer;font-size:1rem;letter-spacing:.5px;transition:.25s;
        }
        .submit-btn:hover{box-shadow:0 8px 28px rgba(212,175,55,.5);transform:translateY(-2px);}
        .submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}

        /* ============ Success ============ */
        .success-icon{font-size:5rem;margin-bottom:16px;text-align:center;filter:drop-shadow(0 0 30px rgba(212,175,55,.6));}
        .order-id{
          background:rgba(212,175,55,.1);border:1px dashed var(--gold);
          padding:14px;border-radius:12px;font-weight:900;color:var(--gold);
          margin:18px 0;font-size:1.2rem;letter-spacing:2px;text-align:center;
        }
        .success-panel p{color:var(--gray);text-align:center;margin-bottom:8px;}
        .success-panel .btn-row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
        .success-panel button{
          background:var(--black-3);color:var(--gold);border:1px solid var(--gold-dark);
          padding:12px 22px;border-radius:50px;font-weight:700;cursor:pointer;
          transition:.25s;font-size:.9rem;
        }
        .success-panel button:hover{background:var(--gold);color:var(--black);}
        .success-panel button.wa{background:#25D366;color:#fff;border-color:#25D366;}
        .success-panel button.wa:hover{background:#1da851;}

        /* ============ Track ============ */
        .track-box{
          max-width:580px;margin:auto;
          background:linear-gradient(160deg,var(--black-2),var(--black));
          border:1px solid var(--border);border-radius:var(--radius);padding:32px;
        }
        .track-box input{
          width:100%;padding:14px;background:var(--black);color:#f5f5f5;
          border:1px solid var(--border);border-radius:10px;
          font-size:1rem;outline:none;margin-bottom:14px;
        }
        .track-box input:focus{border-color:var(--gold);}
        .track-box > button{
          width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));
          color:var(--black);border:none;padding:14px;border-radius:10px;
          font-weight:800;cursor:pointer;font-size:1rem;
        }
        .track-result{margin-top:22px;padding:20px;background:rgba(212,175,55,.05);border-radius:12px;display:none;border:1px solid var(--border);}
        .track-result.show{display:block;}
        .track-result .status{
          display:inline-block;background:rgba(39,174,96,.2);color:#2ecc71;
          padding:5px 16px;border-radius:50px;font-weight:700;font-size:.85rem;margin-bottom:14px;
        }
        .track-result .status.notfound{background:rgba(231,76,60,.2);color:#e74c3c;}
        .track-result .line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:.9rem;}
        .track-result .line:last-child{border:none;}

        /* ============ Admin ============ */
        .admin-tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--border);}
        .admin-tab{
          padding:10px 20px;cursor:pointer;font-weight:700;color:var(--gray);
          border-bottom:2px solid transparent;transition:.25s;font-size:.9rem;
        }
        .admin-tab.active{color:var(--gold);border-color:var(--gold);}
        .admin-tab:hover{color:var(--gold-light);}
        .admin-tab-content{display:none;}
        .admin-tab-content.active{display:block;}

        .admin-product{
          background:rgba(212,175,55,.03);border:1px solid var(--border);
          border-radius:10px;padding:14px;margin-bottom:10px;
          display:flex;justify-content:space-between;align-items:center;gap:12px;transition:.25s;
        }
        .admin-product:hover{border-color:var(--gold-dark);}
        .admin-product .pinfo{flex:1;display:flex;gap:12px;align-items:center;}
        .admin-product .pthumb{
          width:50px;height:50px;border-radius:8px;background:var(--black);
          overflow:hidden;display:grid;place-items:center;font-size:1.5rem;flex-shrink:0;
        }
        .admin-product .pthumb img{width:100%;height:100%;object-fit:cover;}
        .admin-product .pinfo h4{font-size:.95rem;color:#f5f5f5;}
        .admin-product .pinfo span{color:var(--gold);font-weight:700;font-size:.85rem;}
        .admin-product .actions{display:flex;gap:6px;flex-shrink:0;}

        .btn-sm{padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:.78rem;transition:.2s;}
        .btn-edit{background:var(--gold);color:var(--black);}
        .btn-edit:hover{background:var(--gold-light);}
        .btn-del{background:var(--danger);color:#fff;}
        .btn-del:hover{background:#c0392b;}
        .btn-add{
          background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:var(--black);
          width:100%;padding:13px;border-radius:10px;font-weight:800;cursor:pointer;
          border:none;margin-bottom:16px;font-size:.95rem;
        }
        .btn-add:hover{background:linear-gradient(135deg,var(--gold-light),var(--gold));}

        .image-picker{
          border:2px dashed var(--gold-dark);border-radius:12px;
          padding:20px;text-align:center;cursor:pointer;transition:.25s;
          background:rgba(212,175,55,.03);
        }
        .image-picker:hover{border-color:var(--gold);background:rgba(212,175,55,.08);}
        .image-picker input{display:none;}
        .image-preview{
          width:100%;height:180px;object-fit:cover;border-radius:10px;margin-top:12px;display:none;
        }
        .image-preview.show{display:block;}

        .logo-picker-preview{
          width:120px;height:120px;object-fit:contain;border-radius:50%;
          background:var(--black);border:2px solid var(--gold);
          padding:8px;margin:14px auto;display:none;
        }
        .logo-picker-preview.show{display:block;}

        /* ============ Toast ============ */
        .toast{
          position:fixed;bottom:28px;left:50%;transform:translate(-50%,150%);
          background:linear-gradient(135deg,var(--gold),var(--gold-dark));
          color:var(--black);padding:14px 26px;border-radius:50px;
          font-weight:800;z-index:400;transition:.4s;
          box-shadow:0 12px 40px rgba(212,175,55,.5);
          max-width:90%;text-align:center;
        }
        .toast.show{transform:translate(-50%,0);}
        .toast.success{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;}

        /* ============ Footer ============ */
        footer{
          background:var(--black-2);color:var(--gray);text-align:center;
          padding:36px 20px;margin-top:60px;border-top:1px solid var(--border);
        }
        .footer-logo{
          width:60px;height:60px;object-fit:contain;border-radius:50%;
          border:2px solid var(--gold);padding:4px;margin:0 auto 14px;
          background:var(--black);display:none;
        }
        .footer-logo.show{display:block;}
        footer strong{
          background:linear-gradient(135deg,var(--gold-light),var(--gold));
          -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;
        }

        /* ============ Responsive ============ */
        @media(max-width:700px){
          .nav-links{display:none;}
          .hero h1{font-size:2rem;}
          .hero p{font-size:1rem;}
          .section-title{font-size:1.5rem;}
          .panel{width:96%;padding:22px;}
          .admin-product{flex-wrap:wrap;}
          .logo-img{width:40px;height:40px;}
          .logo-text{font-size:1.3rem;}
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
            border: 1px solid var(--border);
            border-radius: 10px;
        }
        .settings-grid-item {
            background: var(--black-3);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .settings-grid-item label {
            font-size: 0.75rem;
            display: block;
            margin-bottom: 4px;
            color: var(--gold-light);
        }
        .settings-grid-item input {
            padding: 5px;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<header>
    <div class="nav">
        <div class="logo" onclick="showHome()">
            <img id="headerLogo" class="logo-img" alt="Logo">
            <div class="logo-text">ABDOU <span>DZ</span></div>
        </div>
        <nav class="nav-links">
            <a href="#" onclick="showHome();return false;" data-i18n="nav_home"></a>
            <a href="#products" onclick="showHome();return false;" data-i18n="nav_products"></a>
            <a href="#" onclick="showTrack();return false;" data-i18n="nav_track"></a>
            <a href="#contact" onclick="showHome();return false;" data-i18n="nav_contact"></a>
        </nav>
        <div class="nav-actions">
            <button class="icon-btn" onclick="toggleLang()" id="langBtn">FR</button>
            <button class="icon-btn" onclick="openAdminLogin()" title="Admin">🔑</button>
        </div>
    </div>
</header>

<div id="homeView">
    <section class="hero">
        <img id="heroLogo" class="hero-logo" alt="Logo">
        <h1 data-i18n="hero_title"></h1>
        <div class="gold-line"></div>
        <p data-i18n="hero_sub"></p>
        <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})" data-i18n="hero_btn"></button>
    </section>

    <section class="section" id="products">
        <h2 class="section-title" data-i18n="products_title"></h2>
        <div class="gold-line"></div>
        <p class="section-sub" data-i18n="products_sub"></p>
        <div class="products" id="productsGrid">
            <div class="loading" data-i18n="loading_products"></div>
        </div>
    </section>

    <section class="section" style="background:linear-gradient(160deg,var(--black-2),var(--black));border-radius:var(--radius);border:1px solid var(--border);">
        <h2 class="section-title" data-i18n="about_title"></h2>
        <div class="gold-line"></div>
        <p class="section-sub" style="max-width:700px;margin:auto;" data-i18n="about_text"></p>
    </section>

    <section class="section" id="contact">
        <h2 class="section-title" data-i18n="contact_title"></h2>
        <div class="gold-line"></div>
        <p class="section-sub">
            📞 <strong style="color:var(--gold);">0553893600</strong><br>
            📸 <a href="https://instagram.com/abdo._ms_" target="_blank" style="color:var(--gold);font-weight:700;">@abdo._ms_</a><br>
            📍 <span data-i18n="contact_location"></span>
        </p>
</div>

<div id="trackView" style="display:none;">
    <section class="section" style="padding-top:50px;">
        <h2 class="section-title" data-i18n="track_title"></h2>
        <div class="gold-line"></div>
        <p class="section-sub" data-i18n="track_sub"></p>
        <div class="track-box">
            <input type="text" id="trackInput" data-i18n-ph="track_placeholder">
            <button onclick="trackOrder()" data-i18n="track_btn"></button>
            <div class="track-result" id="trackResult"></div>
        </div>
    </section>
</div>

<footer>
    <img id="footerLogo" class="footer-logo" alt="Logo">
    <p>© 2026 <strong>ABDOU DZ</strong> — <span data-i18n="footer_rights"></span></p>
    <p style="font-size:.85rem;margin-top:8px;" data-i18n="footer_made"></p>
</footer>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<!-- Order Form -->
<div class="panel" id="orderPanel">
    <h3>📦 <span data-i18n="order_title"></span></h3>
    <div id="orderProductPreview" style="text-align:center;margin-bottom:20px;"></div>

    function loadColors() {
        const gold = localStorage.getItem("abdou_color_gold") || "#d4af37";
        const black = localStorage.getItem("abdou_color_black") || "#0a0a0a";
        document.documentElement.style.setProperty('--gold', gold);
        document.documentElement.style.setProperty('--black', black);
        document.getElementById("colorGold").value = gold;
        document.getElementById("colorBlack").value = black;
    }

    function saveColors() {
        const gold = document.getElementById("colorGold").value;
        const black = document.getElementById("colorBlack").value;
        localStorage.setItem("abdou_color_gold", gold);
        localStorage.setItem("abdou_color_black", black);
        loadColors();
        showToast("✅ تم حفظ الألوان بنجاح", "success");
    }

    /* ================= التوصيل ================= */
    function loadDeliverySettings() {
        const grid = document.getElementById("deliverySettingsGrid");
        if(!grid) return;
        grid.innerHTML = "";
        Object.keys(WILAYAS_DATA).forEach(w => {
            const prices = DELIVERY_PRICES[w] || { home: 500, office: 300 };
            grid.innerHTML += `
                <div class="settings-grid-item">
                    <label>${w}</label>
                    <input type="number" id="del_home_${w.replace(/[^a-zA-Z0-9]/g, '')}" value="${prices.home}" placeholder="سعر المنزل" title="سعر المنزل">
                    <input type="number" id="del_office_${w.replace(/[^a-zA-Z0-9]/g, '')}" value="${prices.office}" placeholder="سعر المكتب" title="سعر المكتب">
                </div>
            `;
        });
    }

    function saveDeliverySettings() {
        const newPrices = {};
        Object.keys(WILAYAS_DATA).forEach(w => {
            const safeId = w.replace(/[^a-zA-Z0-9]/g, '');
            const home = Number(document.getElementById(`del_home_${safeId}`).value) || 0;
            const office = Number(document.getElementById(`del_office_${safeId}`).value) || 0;
            newPrices[w] = { home, office };
        });
        DELIVERY_PRICES = newPrices;
        localStorage.setItem("abdou_delivery_prices", JSON.stringify(DELIVERY_PRICES));
        showToast("✅ تم حفظ أسعار التوصيل بنجاح", "success");
    }

    /* ================= اللوغو ================= */
    async function loadLogo(){
        try {
            // جلب اللوغو من جدول products (الصف الوهمي)
            const { data, error } = await sb.from('products').select('image_url').eq('name', '__LOGO__').maybeSingle();
            if(data && data.image_url) {
                currentLogoUrl = data.image_url;
                applyLogo(data.image_url);
            } else {
                // إذا لم يوجد في Supabase، جرب الذاكرة المحلية (احتياطي)
                applyLogo(localStorage.getItem("abdou_logo") || null);
            }
        } catch (e) {
            console.log("No logo found in Supabase, using local.", e);
            applyLogo(localStorage.getItem("abdou_logo") || null);
        }
    }

    function applyLogo(url){
        const imgs = [
            document.getElementById("headerLogo"),
            document.getElementById("heroLogo"),
            document.getElementById("footerLogo")
        ];
        if(url){
            imgs.forEach(img => { img.src = url; img.classList.add("show"); });
            const fav = document.getElementById("faviconLink");
            if(fav) fav.href = url;
        } else {
            imgs.forEach(img => { img.src = ""; img.classList.remove("show"); });
        }
    }

    function previewLogo(e){
        const file = e.target.files[0];
        if(!file) return;
        pendingLogoFile = file;
        const reader = new FileReader();
        reader.onload = ev => {
            const preview = document.getElementById("logoPickerPreview");
            preview.src = ev.target.result;
            preview.classList.add("show");
        };
        reader.readAsDataURL(file);
    }

    async function saveLogo(){
        if(!pendingLogoFile){
            if(!currentLogoUrl){ showToast("⚠️"); return; }
            applyLogo(currentLogoUrl);
            showToast(t("logo_saved"), "success");
            return;
        }

        const btn = document.getElementById("logoSaveBtn");
        btn.disabled = true;
        btn.textContent = t("loading_upload");

        try {
            // 1. رفع صورة اللوغو إلى Supabase Storage
            const fileExt = pendingLogoFile.name.split('.').pop();
            const fileName = `logo_${Date.now()}.${fileExt}`;
            const { data: uploadData, error: uploadError } = await sb.storage.from(BUCKET_NAME).upload(fileName, pendingLogoFile);
            if (uploadError) throw uploadError;

            // 2. الحصول على الرابط العام
            const { data: urlData } = sb.storage.from(BUCKET_NAME).getPublicUrl(fileName);
            const logoUrl = urlData.publicUrl;

            // 3. حفظ الرابط في قاعدة البيانات (نستخدم جدول products بصف وهمي)
            const { data: existing } = await sb.from('products').select('id').eq('name', '__LOGO__').maybeSingle();

            if (existing) {
                await sb.from('products').update({ image_url: logoUrl }).eq('id', existing.id);
            } else {
                await sb.from('products').insert({ name: '__LOGO__', price: 0, image_url: logoUrl, active: false });
            }

            // 4. تحديث الواجهة
            localStorage.setItem("abdou_logo", logoUrl);
            currentLogoUrl = logoUrl;
            applyLogo(logoUrl);
            pendingLogoFile = null;
            document.getElementById("logoInput").value = "";
            showToast(t("logo_saved"), "success");

        } catch (e) {
            console.error(e);
            showToast(t("upload_failed") + " " + e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = t("admin_save_logo");
        }
    }

    function removeLogo(){
        if(!confirm(t("admin_confirm_del"))) return;
        localStorage.removeItem("abdou_logo");
        currentLogoUrl = null;
        applyLogo("");
        pendingLogoFile = null;
        document.getElementById("logoInput").value = "";
        document.getElementById("logoPickerPreview").classList.remove("show");
        showToast(t("logo_removed"), "success");
    }

    /* ================= المنتجات (مع Supabase) ================= */
    async function loadProducts(){
        const grid = document.getElementById("productsGrid");
        grid.innerHTML = `<div class="loading">${t("loading_products")}</div>`;
        try {
            const { data, error } = await sb.from('products').select('*').eq('active', true).neq('name', '__LOGO__');
            if (error) throw error;
            PRODUCTS = data.map(doc => ({
                id: doc.id,
                name: doc.name,
                price: doc.price,
                image_url: doc.image_url
            }));
            renderProducts();
        } catch (error) {
            console.error("Error loading products:", error);
            grid.innerHTML = `<div class="loading" style="color:#e74c3c;">❌ فشل تحميل المنتجات</div>`;
        }
    }

    function renderProducts(){
        const grid = document.getElementById("productsGrid");
        if(!grid) return;
        if(!PRODUCTS.length){
            grid.innerHTML = `<div class="loading">🛍️ ${t("admin_no_products")}</div>`;
            return;
        }
        grid.innerHTML = PRODUCTS.map(p => {
            const img = p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : (p.emoji || "📦");
            return `
            <div class="card">
              <div class="card-img">${img}</div>
              <div class="card-body">
                <div class="card-title">${p.name}</div>
                <div class="card-price">${Number(p.price).toLocaleString()} <small>DZD</small></div>
                <button class="add-btn" onclick="openOrderForm('${p.id}')">${t("buy_now")}</button>
              </div>
            </div>
          `}).join("");
    }

    /* ================= نموذج الطلب ================= */
    function openOrderForm(id){
        const p = PRODUCTS.find(x => x.id == id);
        if(!p) return;
        currentProduct = p;
        const img = p.image_url ? `<img src="${p.image_url}" style="width:120px;height:120px;object-fit:cover;border-radius:14px;margin:auto;border:2px solid var(--gold);">` : `<div style="font-size:3.5rem;">📦</div>`;
        document.getElementById("orderProductPreview").innerHTML = `
            ${img}
            <h4 style="margin-top:10px;color:#f5f5f5;">${p.name}</h4>
            <div style="color:var(--gold);font-weight:900;font-size:1.3rem;">${Number(p.price).toLocaleString()} DZD</div>
        `;
        document.getElementById("cQty").value = 1;
        renderOrderSummary();
        closeAll();
        document.getElementById("overlay").classList.add("open");
        document.getElementById("orderPanel").classList.add("open");
    }

    function fillWilayas(){
        const select = document.getElementById("cWilaya");
        select.innerHTML = `<option value="">${t("f_wilaya_choose")}</option>`;
        Object.keys(WILAYAS_DATA).forEach(w => {
            const opt = document.createElement("option");
            opt.value = w; opt.textContent = w;
            select.appendChild(opt);
        });
    }

    function onWilayaChange(){
        const wilaya = document.getElementById("cWilaya").value;
        const communeField = document.getElementById("communeField");
        const communeSelect = document.getElementById("cCommune");
        if(!wilaya){
            communeField.style.display = "none";
            renderOrderSummary();
            return;
        }
        communeSelect.innerHTML = `<option value="">${t("f_commune_choose")}</option>`;
        (WILAYAS_DATA[wilaya] || []).forEach(c => {
            const opt = document.createElement("option");
            opt.value = c; opt.textContent = c;
            communeSelect.appendChild(opt);
        });
        communeField.style.display = "block";
        renderOrderSummary();
    }

    function calcTotals(){
        if(!currentProduct) return { subtotal:0, shipping:0, total:0 };
        const qty = Number(document.getElementById("cQty").value) || 1;
        const wilaya = document.getElementById("cWilaya").value;
        const deliveryType = document.getElementById("cDelivery").value;
        const subtotal = currentProduct.price * qty;
        let shipping = 0;
        if(wilaya && DELIVERY_PRICES[wilaya]) {
            shipping = deliveryType === "home" ? DELIVERY_PRICES[wilaya].home : DELIVERY_PRICES[wilaya].office;
        }
        return { subtotal, shipping, total: subtotal + shipping, qty };
    }

    function renderOrderSummary(){
        if(!currentProduct) return;
        const { subtotal, shipping, total, qty } = calcTotals();
        const deliveryType = document.getElementById("cDelivery").value;
        const deliveryLabel = deliveryType === "home" ? t("delivery_home") : t("delivery_office");
        document.getElementById("orderSummary").innerHTML = `
            <div class="row"><span>${currentProduct.name} × ${qty}</span><span>${subtotal.toLocaleString()} DZD</span></div>
            <div class="row"><span>${deliveryLabel}</span><span>${shipping.toLocaleString()} DZD</span></div>
            <div class="row total"><span>${t("total_label")}</span><span>${total.toLocaleString()} DZD</span></div>
        `;
    }

    async function submitOrder(e){
        e.preventDefault();
        const btn = document.getElementById("submitBtn");
        btn.disabled = true; btn.textContent = "⏳...";

        const name = document.getElementById("cName").value.trim();
        const phone = document.getElementById("cPhone").value.trim();
        const wilaya = document.getElementById("cWilaya").value;
        const commune = document.getElementById("cCommune").value;
        const address = document.getElementById("cAddress").value.trim();
        const deliveryType = document.getElementById("cDelivery").value;
        const qty = Number(document.getElementById("cQty").value) || 1;

        if(!wilaya || !commune){
            showToast(t("willaya_required"));
            btn.disabled = false; btn.textContent = t("submit_order");
            return;
        }

        const { subtotal, shipping, total } = calcTotals();
        const orderId = "DZ-" + Date.now().toString().slice(-6);
        const deliveryLabel = deliveryType === "home" ? t("delivery_home") : t("delivery_office");

        const order = {
            id: orderId,
            customer: { name, phone, wilaya, commune, address },
            product: { id: currentProduct.id, name: currentProduct.name, price: currentProduct.price, qty },
            deliveryType: deliveryLabel,
            subtotal, shipping, total,
            status: "قيد المراجعة",
            date: new Date().toLocaleString("ar-DZ")
        };

        ORDERS.push(order);
        localStorage.setItem("abdou_orders", JSON.stringify(ORDERS));

        sendToWhatsApp(order);

        closeAll();
        document.getElementById("successOrderId").textContent = orderId;
        document.getElementById("overlay").classList.add("open");
        document.getElementById("successPanel").classList.add("open");

        document.getElementById("orderForm").reset();
        document.getElementById("communeField").style.display = "none";
        btn.disabled = false; btn.textContent = t("submit_order");
    }

    function buildWhatsAppMessage(order){
        const p = order.product;
        let msg = `🛒 *طلب جديد — ABDOU DZ*\n━━━━━━━━━━━━━━━\n`;
        msg += `🔖 ${order.id}\n👤 ${order.customer.name}\n📞 ${order.customer.phone}\n`;
        msg += `📍 ${order.customer.wilaya} - ${order.customer.commune}\n🏠 ${order.customer.address}\n🚚 ${order.deliveryType}\n💳 COD\n`;
        msg += `━━━━━━━━━━━━━━━\n📦 ${p.name} × ${p.qty} = ${(p.price*p.qty).toLocaleString()} DZD\n`;
        msg += `━━━━━━━━━━━━━━━\n💰 *${order.total.toLocaleString()} DZD*\n🕒 ${order.date}`;
        return msg;
    }
    function sendToWhatsApp(order){
        const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(buildWhatsAppMessage(order))}`;
        window.open(url, "_blank");
    }
    let lastOrder = null;
    function sendWhatsAppAgain(){ if(lastOrder) sendToWhatsApp(lastOrder); }

    function showTrack(){
        document.getElementById("homeView").style.display = "none";
        document.getElementById("trackView").style.display = "block";
        window.scrollTo(0,0);
    }
    function showHome(){
        document.getElementById("homeView").style.display = "block";
        document.getElementById("trackView").style.display = "none";
        window.scrollTo(0,0);
    }

    async function trackOrder(){
        const input = document.getElementById("trackInput").value.trim().toUpperCase();
        const result = document.getElementById("trackResult");
        if(!input) return;
        result.classList.add("show");
        result.innerHTML = `<p>⏳...</p>`;
        const o = ORDERS.find(x => x.id === input);
        if(!o){
            result.innerHTML = `<div class="status notfound">${t("order_not_found")}</div>
              <p style="color:var(--gray);font-size:.9rem;">${t("order_not_found_sub")}</p>`;
            return;
        }
        result.innerHTML = `
            <div class="status">✅ ${o.status}</div>
            <div class="line"><span>${t("order_id_label")}</span><strong>${o.id}</strong></div>
            <div class="line"><span>${t("name_label")}</span><span>${o.customer.name}</span></div>
            <div class="line"><span>${t("phone_label")}</span><span>${o.customer.phone}</span></div>
            <div class="line"><span>${t("wilaya_label")}</span><span>${o.customer.wilaya}</span></div>
            <div class="line"><span>${t("total_label_short")}</span><strong style="color:var(--gold)">${Number(o.total).toLocaleString()} DZD</strong></div>
        `;
    }

    /* ================= لوحة الأدمن ================= */
    function openAdminLogin(){
        closeAll();
        document.getElementById("overlay").classList.add("open");
        document.getElementById("adminLogin").classList.add("open");
        document.getElementById("adminPass").value = "";
        setTimeout(() => document.getElementById("adminPass").focus(), 150);
    }

    function checkAdmin(){
        if(document.getElementById("adminPass").value === getAdminPassword()){
            closeAll();
            document.getElementById("overlay").classList.add("open");
            document.getElementById("adminPanel").classList.add("open");
            loadAdminData();
            document.getElementById("currentPass").value = "";
            document.getElementById("newPass").value = "";
            const preview = document.getElementById("logoPickerPreview");
            if(currentLogoUrl){ preview.src = currentLogoUrl; preview.classList.add("show"); }
            else preview.classList.remove("show");
            loadDeliverySettings();
            loadColors();
            showToast("✅ " + t("admin_title"), "success");
        } else {
            showToast(t("admin_wrong"));
        }
    }

    function changeAdminPassword() {
        const current = document.getElementById("currentPass").value;
        const newPass = document.getElementById("newPass").value;
        if (current !== getAdminPassword()) {
            showToast("❌ كلمة السر الحالية غير صحيحة");
            return;
        }
        if (newPass.length < 4) {
            showToast("⚠️ كلمة السر الجديدة يجب أن تكون 4 أحرف على الأقل");
            return;
        }
        localStorage.setItem("abdou_admin_pass", newPass);
        document.getElementById("currentPass").value = "";
        document.getElementById("newPass").value = "";
        showToast("✅ تم تغيير كلمة السر بنجاح", "success");
    }

    function switchAdminTab(tab, el){
        document.querySelectorAll(".admin-tab").forEach(x => x.classList.remove("active"));
        document.querySelectorAll(".admin-tab-content").forEach(x => x.classList.remove("active"));
        el.classList.add("active");
        document.getElementById("tab-" + tab).classList.add("active");
    }

    function loadAdminData(){
        renderAdminProducts();
        renderAdminOrders();
    }

    function renderAdminProducts(){
        const box = document.getElementById("adminProductsList");
        if(!box) return;
        if(!PRODUCTS.length){
            box.innerHTML = `<p style="text-align:center;color:var(--gray);">${t("admin_no_products")}</p>`;
            return;
        }
        box.innerHTML = PRODUCTS.map(p => {
            const thumb = p.image_url ? `<img src="${p.image_url}">` : (p.emoji || "📦");
            return `
            <div class="admin-product">
              <div class="pinfo">
                <div class="pthumb">${thumb}</div>
                <div>
                  <h4>${p.name}</h4>
                  <span>${Number(p.price).toLocaleString()} DZD</span>
                </div>
              </div>
              <div class="actions">
                <button class="btn-sm btn-edit" onclick="editProduct('${p.id}')">${t("admin_edit")}</button>
                <button class="btn-sm btn-del" onclick="deleteProduct('${p.id}')">${t("admin_del")}</button>
              </div>
            </div>
          `}).join("");
    }

    function renderAdminOrders(){
        const box = document.getElementById("adminOrdersList");
        if(!box) return;
        if(!ORDERS.length){
            box.innerHTML = `<p style="text-align:center;color:var(--gray);">${t("admin_no_orders")}</p>`;
            return;
        }
        box.innerHTML = ORDERS.map(o => `
            <div class="admin-product" style="flex-direction:column;align-items:stretch;">
              <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;">
                <strong style="color:var(--gold);">${o.id}</strong>
                <select onchange="updateOrderStatus('${o.id}', this.value)" style="padding:6px 10px;border-radius:8px;background:var(--black);color:#f5f5f5;border:1px solid var(--border);font-family:inherit;font-size:.85rem;">
                  <option value="قيد المراجعة" ${o.status==="قيد المراجعة"?"selected":""}>قيد المراجعة</option>
                  <option value="تم الشحن" ${o.status==="تم الشحن"?"selected":""}>تم الشحن</option>
                  <option value="تم التسليم" ${o.status==="تم التسليم"?"selected":""}>تم التسليم</option>
                  <option value="ملغي" ${o.status==="ملغي"?"selected":""}>ملغي</option>
                </select>
              </div>
              <div style="font-size:.85rem;color:var(--gray);margin-top:8px;line-height:1.8;">
                👤 ${o.customer.name} — 📞 ${o.customer.phone}<br>
                📍 ${o.customer.wilaya} — ${o.customer.address||""}<br>
                🚚 ${o.deliveryType || ""}<br>
                💰 <strong style="color:var(--gold);">${Number(o.total).toLocaleString()} DZD</strong>
              </div>
            </div>
          `).join("");
    }

    function showProductForm(){
        editingProductId = null;
        uploadedImageUrl = null;
        document.getElementById("pName").value = "";
        document.getElementById("pPrice").value = "";
        document.getElementById("pImageInput").value = "";
        const preview = document.getElementById("pImagePreview");
        preview.classList.remove("show"); preview.src = "";
        document.getElementById("adminProductForm").style.display = "block";
    }
    function hideProductForm(){
        document.getElementById("adminProductForm").style.display = "none";
        editingProductId = null; uploadedImageUrl = null;
    }
    function editProduct(id){
        const p = PRODUCTS.find(x => x.id == id);
        if(!p) return;
        editingProductId = id;
        uploadedImageUrl = p.image_url || null;
        document.getElementById("pName").value = p.name;
        document.getElementById("pPrice").value = p.price;
        const preview = document.getElementById("pImagePreview");
        if(p.image_url){ preview.src = p.image_url; preview.classList.add("show"); }
        else preview.classList.remove("show");
        document.getElementById("adminProductForm").style.display = "block";
    }
    function previewImage(e){
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            const preview = document.getElementById("pImagePreview");
            preview.src = ev.target.result;
            preview.classList.add("show");
        };
        reader.readAsDataURL(file);
    }

    async function uploadImage(file){
        try {
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}.${fileExt}`;
            const { data, error } = await sb.storage.from(BUCKET_NAME).upload(fileName, file);
            if (error) throw error;
            const { data: urlData } = sb.storage.from(BUCKET_NAME).getPublicUrl(fileName);
            return urlData.publicUrl;
        } catch (err) {
            console.error("Upload Error Details:", err);
            throw err;
        }
    }

    async function saveProduct(){
        const name = document.getElementById("pName").value.trim();
        const price = Number(document.getElementById("pPrice").value);
        const fileInput = document.getElementById("pImageInput");
        const file = fileInput.files[0];
        if(!name || !price){ showToast("⚠️"); return; }
        const btn = document.getElementById("pSaveBtn");
        btn.disabled = true;

        try{
            let imageUrl = uploadedImageUrl;
            if(file){
                btn.textContent = t("loading_upload");
                imageUrl = await uploadImage(file);
            }

            if(editingProductId){
                const { error } = await sb.from('products').update({
                    name: name,
                    price: price,
                    image_url: imageUrl
                }).eq('id', editingProductId);
                if(error) throw error;
                showToast(t("product_updated"), "success");
            } else {
                const { error } = await sb.from('products').insert({
                    name: name,
                    price: price,
                    image_url: imageUrl,
                    active: true
                });
                if(error) throw error;
                showToast(t("product_added"), "success");
            }

            hideProductForm();
            loadProducts();
            loadAdminData();
        }catch(e){
            console.error("Save Error:", e);
            showToast(t("upload_failed") + " " + e.message);
        }finally{
            btn.disabled = false;
            btn.textContent = t("admin_save");
        }
    }

    async function deleteProduct(id){
        if(!confirm(t("admin_confirm_del"))) return;
        try {
            const { error } = await sb.from('products').delete().eq('id', id);
            if(error) throw error;
            showToast(t("product_deleted"), "success");
            loadProducts();
            loadAdminData();
        } catch(e) {
            console.error(e);
            showToast("❌ " + e.message);
        }
    }

    function updateOrderStatus(id, status){
        const index = ORDERS.findIndex(o => o.id === id);
        if(index !== -1) {
            ORDERS[index].status = status;
            localStorage.setItem("abdou_orders", JSON.stringify(ORDERS));
            showToast("✅ " + status, "success");
        }
    }

    /* ================= فتح/إغلاق ================= */
    function closeAll(){
        document.getElementById("overlay").classList.remove("open");
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("open"));
    }

    /* ================= Toast ================= */
    let toastTimer;
    function showToast(msg, type){
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "toast show" + (type ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
    }

    /* ================= تشغيل ================= */
    applyLang();
    fillWilayas();
    loadLogo();
    loadColors();
    loadProducts();
</script>
</body>
</html>
